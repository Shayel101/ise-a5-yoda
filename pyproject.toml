[project]
name = "ise-a5-yoda"
version = "0.1.0"
description = "ISE-A5: falsification study of fault-tolerance claims of the YODA ANN (Vioque et al. 2020)"
requires-python = "==3.12.*"
dependencies = [
    "tensorflow==2.16.2",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "scikit-learn==1.5.2",
    "scipy==1.14.1",
    "matplotlib==3.9.3",
    "pyyaml==6.0.2",
    "astroquery==0.4.7",
    "astropy==6.1.7",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "jupyter==1.1.1",
    "nbconvert==7.16.4",
    "ipykernel==6.29.5",
    "pypandoc-binary==1.15",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
